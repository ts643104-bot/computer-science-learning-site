<!doctype html>
<html lang="ar" dir="rtl">
 <head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <meta name="theme-color" content="#070C17" />
   <title>شبكة وعلوم | بوابة الطلاب</title>
   <meta
   name="description"
   content="منصة تعليمية باللهجة المصرية تشرح علوم الحاسب والشبكات من الأساسيات لحد الاحتراف."
   />
   <link rel="preconnect" href="https://fonts.googleapis.com" />
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
   <link
     href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
     rel="stylesheet"
   />
   <link rel="stylesheet" crossorigin href="./assets/index-BUb9AD-X.css">
   <link rel="stylesheet" href="./login.css">
 </head>
 <body>
   <div id="authShell" class="lg-shell">
     <div class="glow-top"></div>
     <div class="lg-card glass">
       <div class="lg-brand">
         <div class="lg-logo">📚</div>
         <div>
           <div class="lg-title">شبكة وعلوم</div>
           <div class="lg-sub">بوابة الطلاب</div>
         </div>
       </div>
       <div class="lg-tabs">
         <button class="lg-tab on" id="tabLogin" type="button">تسجيل الدخول</button>
         <button class="lg-tab" id="tabRegister" type="button">إنشاء حساب جديد</button>
       </div>
       <p class="lg-help" id="modeHelp">اكتب بريدك الإلكتروني وكلمة المرور للدخول إلى المنصة.</p>
       <div id="formMsg" class="lg-msg"></div>
       <form id="authForm">
         <div class="lg-field lg-hidden" id="nameField">
           <label for="username">اسم الطالب</label>
           <input class="lg-input" id="username" type="text" placeholder="اكتب اسمك" autocomplete="name" minlength="3" maxlength="24" />
         </div>
         <div class="lg-field">
           <label for="email">البريد الإلكتروني</label>
           <input class="lg-input lg-mono" id="email" type="email" placeholder="student@example.com" autocomplete="email" required />
         </div>
         <div class="lg-field">
           <label for="password">كلمة المرور</label>
           <input class="lg-input lg-mono" id="password" type="password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
         </div>
         <button class="lg-btn" type="submit" id="submitBtn">دخول</button>
       </form>
       <p class="lg-back">
         <a href="./admin.html">لوحة الأدمن</a>
       </p>
     </div>
     <div class="lg-foot">تصميم المهندس طه سلطان / タハ A3</div>
   </div>
   <div id="root" class="lg-hidden"></div>
   <div id="site-footer" class="lg-hidden">تصميم المهندس طه سلطان / タハ A3</div>
   <script type="module" src="./firebase-config.js"></script>
   <script type="module" src="./app.js"></script>
 </body>
</html>
