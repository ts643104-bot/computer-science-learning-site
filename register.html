<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إنشاء حساب | شبكة وعلوم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>

<body>
  <div class="rg-shell">
    <div class="rg-glow"></div>

    <div class="rg-card">
      <div class="rg-brand">
        <div class="rg-logo">A3</div>
        <div>
          <div class="rg-title">شبكة وعلوم</div>
          <div class="rg-sub">تسجيل حساب جديد</div>
        </div>
      </div>

      <p class="rg-help">اكتب اسمك وبريدك الإلكتروني وكلمة المرور، وهيتم إرسال طلبك للأدمن للمراجعة والموافقة.</p>

      <div id="formMsg" class="rg-msg"></div>

      <form id="registerForm" autocomplete="off">
        <label class="rg-field">
          <span>الاسم</span>
          <input id="username" type="text" placeholder="اكتب اسمك" required minlength="3" maxlength="24">
        </label>

        <label class="rg-field">
          <span>البريد الإلكتروني</span>
          <input id="email" type="email" placeholder="student@example.com" required>
        </label>

        <label class="rg-field">
          <span>كلمة المرور</span>
          <input id="password" type="password" placeholder="••••••••" required minlength="6">
        </label>

        <button id="submitBtn" type="submit" class="rg-btn">فعّل حسابي وابدأ</button>
      </form>

      <p class="rg-back">
        <a href="./login.html">عندي حساب بالفعل</a>
      </p>
    </div>

    <div class="rg-foot">تصميم المهندس طه سلطان / タハ A3</div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="register-app.js"></script>
</body>

</html>
