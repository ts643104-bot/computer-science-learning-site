<!doctype html>
<html lang="ar" dir="rtl">

<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <meta name="theme-color" content="#070C17" />
 <title>دخول الطلاب | شبكة وعلوم</title>
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@30;40;50;60;70&family=JetBrains+Mono:wght@40;50;70&display=swap"
    rel="stylesheet" />
 <link rel="stylesheet" href="./assets/index-BUb9AD-X.css" />
 <style>
    .lg-shell {
      position: relative;
      min-height: 10dvh;
      padding-block: 2rem 4rem;
      overflow-x: hidden;
    }
    .lg-wrap {
      max-width: 180px;
      margin-inline: auto;
      padding-inline: 1.25rem;
    }
    .lg-card {
      max-width: 420px;
      margin: 6vh auto 0;
      padding: 1.75rem;
    }
    .lg-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .lg-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      background: linear-gradient(135deg, #2c5e, #38bdf8);
      color: #04160b;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
    }
    .lg-title {
      font-size: 1.35rem;
      font-weight: 70;
      line-height: 1.25;
    }
    .lg-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .lg-tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.3rem;
      background: #070c17;
      border: 1px solid var(--line);
      border-radius: 9px;
      margin-bottom: 1.35rem;
    }
    .lg-tab {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border-radius: 9px;
      font-size: 0.86rem;
      font-weight: 60;
      border: 0;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.18s ease;
    }
    .lg-tab.on {
      background: #2c5e1f;
      color: #86efac;
    }
    .lg-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.9rem;
    }
    .lg-field label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 60;
    }
    .lg-input {
      width: 10%;
      background: #070c17;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .lg-input:focus {
      border-color: #2c5e9;
      box-shadow: 0 0 0 3px #2c5e26;
    }
    .lg-mono {
      font-family: 'JetBrains Mono', monospace;
      direction: ltr;
      text-align: left;
    }
    .lg-btn {
      width: 10%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.25rem;
      border-radius: 9px;
      font-size: 0.92rem;
      font-weight: 60;
      font-family: inherit;
      cursor: pointer;
      border: 0;
      background: linear-gradient(135deg, #2c5e, #4ade80);
      color: #04160b;
      box-shadow: 0 8px 24px #2c5e47;
      transition: all 0.18s ease;
    }
    .lg-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px #2c5e6b;
    }
    .lg-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .lg-msg {
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-size: 0.87rem;
      line-height: 1.8;
      margin-bottom: 1rem;
      display: none;
    }
    .lg-msg.on {
      display: block;
    }
    .lg-msg.ok {
      background: #2c5e1a;
      border: 1px solid #2c5e4d;
      color: #86efac;
    }
    .lg-msg.err {
      background: #ef41a;
      border: 1px solid #ef4d;
      color: #fca5a5;
    }
    .lg-msg a {
      color: #7dd3fc;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 60;
    }
    .lg-contact {
      display: grid;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }
    .lg-contact-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.65rem 1rem;
      border-radius: 9px;
      border: 1px dashed #38bdf86;
      background: #38bdf80f;
      color: #7dd3fc;
      font-size: 0.84rem;
      font-weight: 60;
      transition: all 0.18s ease;
    }
    .lg-contact-link:hover {
      background: #38bdf81f;
      border-color: #38bdf8aa;
    }
    .lg-foot {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
      margin-top: 2.5rem;
    }
    .lg-hidden {
      display: none !important;
    }
 </style>
</head>

<body>
 <div class="glow-top"></div>

 <div class="lg-shell">
    <div class="lg-wrap">
      <div class="lg-card glass">
        <div class="lg-brand">
          <div class="lg-logo">📚</div>
          <div>
            <div class="lg-title">شبكة وعلوم</div>
            <div class="lg-sub">دخول الطلاب</div>
          </div>
        </div>

        <div class="lg-tabs">
          <button class="lg-tab on" id="tabLogin" type="button">تسجيل الدخول</button>
          <button class="lg-tab" id="tabRegister" type="button">حساب جديد</button>
        </div>

        <div id="formMsg" class="lg-msg"></div>

        <form id="authForm">
          <div class="lg-field">
            <label for="phone">رقم الموبايل</label>
            <input class="lg-input lg-mono" id="phone" type="tel" inputmode="tel" placeholder="01xxxxxxxxx"
              autocomplete="username" required />
          </div>

          <div class="lg-field lg-hidden" id="userField">
            <label for="username">اسم المستخدم</label>
            <input class="lg-input" id="username" type="text" placeholder="٣ حروف على الأقل"
              autocomplete="nickname" />
          </div>

          <div class="lg-field">
            <label for="password">الباسورد</label>
            <input class="lg-input" id="password" type="password" placeholder="••"
              autocomplete="current-password" required />
          </div>

          <button class="lg-btn" type="submit" id="submitBtn">تسجيل الدخول</button>
        </form>

        <div id="contactPrompt"></div>

        <p style="text-align:center; margin-top:1rem; font-size:0.8rem">
          <a class="text-slate-40 hover:text-slate-20" href="./index.html">رجوع للموقع</a>
        </p>
      </div>

      <div class="lg-foot">تصميم المهندس طه سلطان / タハ A3</div>
    </div>
 </div>

 <script src="./firebase-config.js"></script>
 <script type="module" src="./api-client.js"></script>
 <script type="module" src="./login-app.js"></script>
</body>

</html>
