<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070C17" />
  <title>دخول الطلاب | شبكة وعلوم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./assets/index-BUb9AD-X.css" />
  <style>
    .lg-shell {
      position: relative;
      min-height: 100dvh;
      padding-block: 2rem 4rem;
      overflow-x: hidden;
    }

    .lg-wrap {
      max-width: 1180px;
      margin-inline: auto;
      padding-inline: 1.25rem;
    }

    .lg-card {
      max-width: 420px;
      margin: 6vh auto 0;
      padding: 1.75rem;
    }

    .lg-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .lg-logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      color: #04160b;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
    }

    .lg-title {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .lg-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .lg-tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.3rem;
      background: #070c17;
      border: 1px solid var(--line);
      border-radius: 999px;
      margin-bottom: 1.35rem;
    }

    .lg-tab {
      flex: 1;
      padding: 0.55rem 0.75rem;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.18s ease;
    }

    .lg-tab.on {
      background: #22c55e1f;
      color: #86efac;
    }

    .lg-field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.9rem;
    }

    .lg-field label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .lg-input {
      width: 100%;
      background: #070c17;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      padding: 0.7rem 0.9rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .lg-input:focus {
      border-color: #22c55e99;
      box-shadow: 0 0 0 3px #22c55e26;
    }

    .lg-mono {
      font-family: 'JetBrains Mono', monospace;
      direction: ltr;
      text-align: left;
    }

    .lg-btn {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: 0;
      background: linear-gradient(135deg, #22c55e, #4ade80);
      color: #04160b;
      box-shadow: 0 8px 24px #22c55e47;
      transition: all 0.18s ease;
    }

    .lg-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px #22c55e6b;
    }

    .lg-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .lg-msg {
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-size: 0.87rem;
      line-height: 1.8;
      margin-bottom: 1rem;
      display: none;
    }

    .lg-msg.on {
      display: block;
    }

    .lg-msg.ok {
      background: #22c55e1a;
      border: 1px solid #22c55e4d;
      color: #86efac;
    }

    .lg-msg.err {
      background: #ef44441a;
      border: 1px solid #ef44444d;
      color: #fca5a5;
    }

    .lg-msg a {
      color: #7dd3fc;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
    }

    .lg-telegram {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      margin-top: 1.25rem;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      border: 1px dashed #38bdf866;
      background: #38bdf80f;
      color: #7dd3fc;
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.18s ease;
    }

    .lg-telegram:hover {
      background: #38bdf81f;
      border-color: #38bdf8aa;
    }

    .lg-foot {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.78rem;
      margin-top: 2.5rem;
    }

    .lg-hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="glow-top"></div>

  <div class="lg-shell">
    <div class="lg-wrap">
      <div class="lg-card glass">
        <div class="lg-brand">
          <div class="lg-logo">📚</div>
          <div>
            <div class="lg-title">شبكة وعلوم</div>
            <div class="lg-sub">دخول الطلاب</div>
          </div>
        </div>

        <div class="lg-tabs">
          <button class="lg-tab on" id="tabLogin" type="button">تسجيل الدخول</button>
          <button class="lg-tab" id="tabRegister" type="button">حساب جديد</button>
        </div>

        <div id="formMsg" class="lg-msg"></div>

        <form id="authForm">
          <div class="lg-field">
            <label for="phone">رقم الموبايل</label>
            <input class="lg-input lg-mono" id="phone" type="tel" inputmode="tel" placeholder="01xxxxxxxxx"
              autocomplete="username" required />
          </div>

          <div class="lg-field lg-hidden" id="userField">
            <label for="username">اسم المستخدم</label>
            <input class="lg-input" id="username" type="text" placeholder="٣ حروف على الأقل"
              autocomplete="nickname" />
          </div>

          <div class="lg-field">
            <label for="password">الباسورد</label>
            <input class="lg-input" id="password" type="password" placeholder="••••••••"
              autocomplete="current-password" required />
          </div>

          <button class="lg-btn" type="submit" id="submitBtn">تسجيل الدخول</button>
        </form>

        <a class="lg-telegram" href="https://t.me/a3Taha" target="_blank" rel="noopener noreferrer">
          📩 طلب اشتراك جديد على تليجرام
        </a>

        <p style="text-align:center; margin-top:1rem; font-size:0.8rem">
          <a class="text-slate-400 hover:text-slate-200" href="./index.html">رجوع للموقع</a>
        </p>
      </div>

      <div class="lg-foot">تصميم المهندس طه سلطان / タハ A3</div>
    </div>
  </div>

  <script src="./api-client.js"></script>
  <script>
    const $ = (id) => document.getElementById(id)

    let mode = 'login'

    const notify = (text, kind) => {
      const el = $('formMsg')
      if (!text) {
        el.className = 'lg-msg'
        return
      }
      el.innerHTML = text
      el.className = 'lg-msg on ' + (kind === 'err' ? 'err' : 'ok')
    }

    const setMode = (next) => {
      mode = next
      const isRegister = mode === 'register'

      $('tabLogin').classList.toggle('on', !isRegister)
      $('tabRegister').classList.toggle('on', isRegister)
      $('userField').classList.toggle('lg-hidden', !isRegister)
      $('username').required = isRegister
      $('submitBtn').textContent = isRegister ? 'إنشاء الحساب' : 'تسجيل الدخول'
      $('password').autocomplete = isRegister ? 'new-password' : 'current-password'
      notify('')
    }

    const telegramNotice = (message) =>
      message +
      '<br><a href="' + window.TELEGRAM_URL + '" target="_blank" rel="noopener noreferrer">' +
      '📩 اضغط هنا لطلب اشتراك جديد على تليجرام</a>'

    const friendlyError = (err) => {
      const code = err && err.code
      const text = (err && err.message) || 'حصل خطأ غير متوقع'

      if (code === 'NOT_WHITELISTED' || text.includes('مش مسموح')) {
        return telegramNotice('رقمك مش مسجّل في قائمة المشتركين.')
      }
      if (code === 'PHONE_TAKEN') {
        return 'الرقم ده متسجّل بالفعل — جرّب تسجيل الدخول.'
      }
      if (code === 'USERNAME_TAKEN') {
        return 'اسم المستخدم ده محجوز، اختار اسم تاني.'
      }
      if (code === 'BAD_CREDENTIALS') {
        return 'الرقم أو الباسورد غلط.'
      }
      if (text.includes('مش قادر أوصل') || text.includes('مش بيرد صح') || text.includes('منشور')) {
        return telegramNotice('مش قادر أوصل للسيرفر دلوقتي.')
      }
      return text
    }

    $('tabLogin').addEventListener('click', () => setMode('login'))
    $('tabRegister').addEventListener('click', () => setMode('register'))

    $('authForm').addEventListener('submit', async (event) => {
      event.preventDefault()

      const button = $('submitBtn')
      const original = button.textContent
      button.disabled = true
      button.textContent = 'لحظة…'
      notify('')

      const phone = $('phone').value.trim()
      const password = $('password').value

      try {
        if (mode === 'register') {
          const username = $('username').value.trim()
          await window.Api.register(phone, username, password)
          notify('تم إنشاء حسابك بنجاح! جاري تحويلك…', 'ok')
        } else {
          const data = await window.Api.login(phone, password)
          notify('أهلاً بيك ' + (data.user ? data.user.username : '') + '! جاري تحويلك…', 'ok')
        }

        $('password').value = ''
        setTimeout(() => {
          window.location.href = './index.html#/'
        }, 700)
      } catch (err) {
        notify(friendlyError(err), 'err')
        button.disabled = false
        button.textContent = original
      }
    })

    setMode('login')
  </script>
</body>

</html>
