﻿<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070C17" />
  <title>دخول الطلاب | شبكة وعلوم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./assets/index-BUb9AD-X.css" />
  <link rel="stylesheet" href="./login.css" />
</head>

<body>
  <div class="lg-shell">
    <div class="glow-top"></div>

    <div class="lg-card glass">
        <div class="lg-brand">
          <div class="lg-logo">📚</div>
          <div>
            <div class="lg-title">شبكة وعلوم</div>
            <div class="lg-sub">دخول الطلاب</div>
          </div>
        </div>

        <div class="lg-tabs">
          <button class="lg-tab on" id="tabLogin" type="button">دخول</button>
          <button class="lg-tab" id="tabRegister" type="button">حساب جديد</button>
        </div>

        <p class="lg-help" id="modeHelp">اكتب بريدك الإلكتروني وكلمة المرور للدخول. لو مش مسجّل قبل كده، أنشئ حساب جديد وطلبك هيتم مراجعته من الأدمن.</p>

        <div id="formMsg" class="lg-msg"></div>

        <form id="authForm">
          <div class="lg-field">
            <label for="email">البريد الإلكتروني</label>
            <input class="lg-input lg-mono" id="email" type="email" placeholder="student@example.com"
              autocomplete="email" required />
          </div>

          <div class="lg-field">
            <label for="password">كلمة المرور</label>
            <input class="lg-input lg-mono" id="password" type="password" placeholder="••••••••"
              autocomplete="current-password" required minlength="6" />
          </div>

          <button class="lg-btn" type="submit" id="submitBtn">دخول</button>
        </form>

        <p class="lg-back">
          <a href="./index.html">رجوع للموقع</a>
        </p>
    </div>

    <div class="lg-foot">تصميم المهندس طه سلطان / タハ A3</div>
  </div>

 <script type="module" src="./firebase-config.js"></script>
 <script type="module" src="./login-app.js"></script>
</body>

</html>
