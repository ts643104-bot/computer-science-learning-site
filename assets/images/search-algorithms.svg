<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">مقارنة البحث الخطي والبحث الثنائي</title>
  <desc id="description">البحث عن 16 في قائمة مرتبة: يفحص البحث الخطي خمسة عناصر، بينما يصل البحث الثنائي إليه في ثلاثة فحوص.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10213a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="520" rx="28" fill="url(#background)"/>
  <text x="480" y="62" fill="#f1f5f9" font-size="32" font-weight="700" text-anchor="middle" direction="rtl">اختيار طريقة البحث يوفر فحوصًا</text>
  <text x="480" y="100" fill="#94a3b8" font-size="18" text-anchor="middle" direction="rtl">نبحث عن ١٦ في قائمة مرتبة — البحث الثنائي يحتاج قائمة مرتبة</text>
  <rect x="378" y="120" width="204" height="44" rx="22" fill="#172f47" stroke="#38bdf8"/>
  <text x="480" y="149" fill="#bae6fd" font-size="18" font-weight="700" text-anchor="middle" direction="rtl">الهدف: 16</text>
  <text x="870" y="215" fill="#cbd5e1" font-size="18" font-weight="700" text-anchor="end" direction="rtl">بحث خطّي</text>
  <text x="870" y="384" fill="#cbd5e1" font-size="18" font-weight="700" text-anchor="end" direction="rtl">بحث ثنائي</text>
