<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">قراءة العدد الثنائي 01011</title>
  <desc id="description">أوزان الخانات من 16 إلى 1، والبتات 01011، ومجموع القيم يساوي 11 بالنظام العشري.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10213a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="28" fill="url(#background)"/>
  <text x="480" y="66" fill="#f1f5f9" font-size="32" font-weight="700" text-anchor="middle" direction="rtl">كل خانة ثنائية لها وزن</text>
  <text x="480" y="104" fill="#94a3b8" font-size="19" text-anchor="middle" direction="rtl">نضرب البت في قوة العدد ٢ المناسبة لمكانه</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(134 145)">
      <rect width="128" height="166" rx="18" fill="#14243a" stroke="#334155"/>
      <text x="64" y="38" fill="#94a3b8" font-size="18">١٦</text>
      <text x="64" y="101" fill="#f8fafc" font-size="45" font-weight="700">0</text>
      <text x="64" y="143" fill="#38bdf8" font-size="20">0 × ١٦</text>
    </g>
    <g transform="translate(276 145)">
      <rect width="128" height="166" rx="18" fill="#14243a" stroke="#334155"/>
      <text x="64" y="38" fill="#94a3b8" font-size="18">٨</text>
      <text x="64" y="101" fill="#f8fafc" font-size="45" font-weight="700">1</text>
      <text x="64" y="143" fill="#38bdf8" font-size="20">1 × ٨</text>
    </g>
    <g transform="translate(418 145)">
      <rect width="128" height="166" rx="18" fill="#14243a" stroke="#334155"/>
      <text x="64" y="38" fill="#94a3b8" font-size="18">٤</text>
      <text x="64" y="101" fill="#f8fafc" font-size="45" font-weight="700">0</text>
      <text x="64" y="143" fill="#38bdf8" font-size="20">0 × ٤</text>
    </g>
    <g transform="translate(560 145)">
      <rect width="128" height="166" rx="18" fill="#14243a" stroke="#334155"/>
      <text x="64" y="38" fill="#94a3b8" font-size="18">٢</text>
      <text x="64" y="101" fill="#f8fafc" font-size="45" font-weight="700">1</text>
      <text x="64" y="143" fill="#38bdf8" font-size="20">1 × ٢</text>
    </g>
    <g transform="translate(702 145)">
      <rect width="128" height="166" rx="18" fill="#14243a" stroke="#334155"/>
      <text x="64" y="38" fill="#94a3b8" font-size="18">١</text>
      <text x="64" y="101" fill="#f8fafc" font-size="45" font-weight="700">1</text>
      <text x="64" y="143" fill="#38bdf8" font-size="20">1 × ١</text>
    </g>
  </g>
  <rect x="248" y="354" width="464" height="76" rx="20" fill="#102c43" stroke="url(#accent)" stroke-width="2"/>
  <text x="480" y="385" fill="#bae6fd" font-size="19" text-anchor="middle" direction="rtl">نجمع القيم الناتجة</text>
  <text x="480" y="414" fill="#f8fafc" font-size="25" font-weight="700" text-anchor="middle">0 + 8 + 0 + 2 + 1 = 11</text>
</svg>
