<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">تحويل العدد 13 بين العشري والثنائي والسادس عشر</title>
  <desc id="description">العدد 13 بالعشري يساوي 1101 بالثنائي ويساوي D بالسادس عشر، مع أوزان الخانات الثنائية.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10213a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" rx="28" fill="url(#background)"/>
  <text x="480" y="66" fill="#f1f5f9" font-size="32" font-weight="700" text-anchor="middle" direction="rtl">القيمة واحدة والكتابة تختلف</text>
  <text x="480" y="104" fill="#94a3b8" font-size="19" text-anchor="middle" direction="rtl">مثال: العدد ثلاثة عشر في ثلاثة أنظمة</text>
